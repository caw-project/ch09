[project]
name = "collabhub-delivery"
version = "0.1.0"
description = "The delivery team's backends — where issues live (local files, GitHub) — behind one interface and a CLI. Dev only — no image installs it."
requires-python = ">=3.12,<3.13"
# Standard library only: each remote adaptor drives its platform's own CLI.
dependencies = []

[project.scripts]
delivery = "delivery.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["delivery"]
