# charts/collabhub on the local k3d cluster. Layered over values.yaml by
# scripts/deploy.sh, which also sets image.registry and image.tag.
#
# The Secrets, data stores, Dex and the Ingress this expects come from
# charts/collabhub-deps, and KEDA from `deploy.sh infra`. The browser reaches
# everything on one origin, which is APP_ORIGIN. deploy.sh sets everything
# derived from it — `origin` (so Messaging's CORS_ALLOWED_ORIGINS is that one
# origin, never empty), AUTH_ISSUER, SPA_REDIRECT_URI, the Ingress host — along
# with the namespace-qualified
# REDIS_STREAMS_ADDRESS. None of it belongs here, so one file serves any number
# of instances on the cluster.

# A build from a dirty worktree reuses its tag, so never trust a cached image.
imagePullPolicy: Always

# k3s's bundled Traefik. The host comes from APP_ORIGIN (scripts/deploy.sh).
ingress:
  enabled: true
  className: traefik

components:
  auth:
    # Two on purpose: both replicas must sign with the one key in the Secret and
    # publish the same JWKS, and one replica would never show it if they didn't.
    replicaCount: 2
    env:
      # `local` gives every account the shared demo workspace.
      APP_ENV: local
      LOG_LEVEL: debug

  messaging:
    # Two, so real-time delivery crosses pods through the R2 backplane.
    replicaCount: 2
    env:
      APP_ENV: local
      LOG_LEVEL: debug

  canvas:
    replicaCount: 1
    env:
      APP_ENV: local
      LOG_LEVEL: debug

  asset:
    replicaCount: 1
    env:
      APP_ENV: local
      LOG_LEVEL: debug

  worker:
    # Autoscaling stays on: deploy.sh installs KEDA, so the pools' ScaledObjects
    # run here as they would in a real cluster, and the batch pool sits at zero
    # until jobs:index has lag.
    env:
      APP_ENV: local
      LOG_LEVEL: debug

  frontend:
    replicaCount: 1

# The peers values.yaml leaves to each environment. k3s enforces NetworkPolicy
# with its embedded kube-router controller, so these have to be right, not just
# present. Everything but the ingress controller is a pod in this namespace from
# charts/collabhub-deps, matched on the name label that chart gives it. `dns`
# keeps the values.yaml default, which is what k3s's CoreDNS carries.
networkPolicy:
  peers:
    # k3s's bundled Traefik, not the ingress-nginx values.yaml assumes.
    ingressController:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
    postgres:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
    redisCache:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-cache
    redisRealtime:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-rt
    redisStreams:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: redis-streams
    elasticsearch:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
    objectStore:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: garage
    otelCollector:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
    # Dex, reached in-cluster on its own port rather than a real IdP's 443.
    oidcProvider:
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: dex
      ports:
        - port: 5556
          protocol: TCP
