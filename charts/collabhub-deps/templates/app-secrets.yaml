{{- /*
The Secrets charts/collabhub names in each component's `envFromSecrets`,
rendered from the credentials the environment supplies — its values file, or
`--set-string` on `scripts/deploy.sh infra`. A production environment would
take them from a secret store such as Sealed Secrets, Vault or Key Vault
instead (register D41).

Every address is an in-cluster Service name, and they read like .env.example
because the Services here are named like the Compose services.
*/}}
{{- $app := .Values.appRelease }}
{{- $garage := .Values.garage }}
{{- $authName := printf "%s-auth" $app }}

{{- /*
Auth's RS256 signing key. A key supplied as `auth.signingKey` always wins.
Otherwise it is generated on first install, then read back on every upgrade: a
new key would invalidate every access token and refresh cookie in the cluster.
Both Auth replicas load it, so both sign with — and publish — the same key.
`lookup` finds nothing under `helm template` or `helm lint`, which only means
those render a fresh key.
*/}}
{{- $signingKey := .Values.auth.signingKey }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $authName }}
{{- if not $signingKey }}
{{- if $existing }}
{{- if hasKey ($existing.data | default dict) "AUTH_SIGNING_KEY" }}
{{- $signingKey = index $existing.data "AUTH_SIGNING_KEY" | b64dec }}
{{- end }}
{{- end }}
{{- end }}
{{- if not $signingKey }}
{{- $signingKey = genPrivateKey "rsa" }}
{{- end }}

{{- $clientSecret := include "collabhub-deps.credential" (dict "path" "dex.clientSecret" "value" .Values.dex.clientSecret) }}
{{- $workerSecret := include "collabhub-deps.credential" (dict "path" "workerClientSecret" "value" .Values.workerClientSecret) }}
{{- $accessKeyId := include "collabhub-deps.credential" (dict "path" "garage.accessKeyId" "value" $garage.accessKeyId) }}
{{- $secretAccessKey := include "collabhub-deps.credential" (dict "path" "garage.secretAccessKey" "value" $garage.secretAccessKey) }}

{{- $oidcProviders := list (dict
  "name" "dex"
  "authority" (printf "%s/dex" .Values.origin)
  "internalAuthority" "http://dex:5556/dex"
  "clientId" "collabhub-auth"
  "clientSecret" $clientSecret) }}
{{- $serviceClients := list (dict
  "client_id" "worker"
  "secret" $workerSecret
  "scopes" (list "assets:write-variants")) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authName }}
  labels:
    {{- include "collabhub-deps.labels" (dict "root" $ "name" "auth") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "collabhub-deps.dsn" (dict "root" $ "db" "auth") | quote }}
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  AUTH_SIGNING_KEY: {{ $signingKey | quote }}
  OIDC_PROVIDERS: {{ $oidcProviders | toJson | quote }}
  AUTH_SERVICE_CLIENTS: {{ $serviceClients | toJson | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-messaging
  labels:
    {{- include "collabhub-deps.labels" (dict "root" $ "name" "messaging") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "collabhub-deps.dsn" (dict "root" $ "db" "messaging") | quote }}
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  REDIS_REALTIME_URL: redis://redis-rt:6379/0
  REDIS_STREAMS_URL: redis://redis-streams:6379/0
  # Read-only, for GET /search/messages.
  ELASTICSEARCH_URL: http://elasticsearch:9200
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-canvas
  labels:
    {{- include "collabhub-deps.labels" (dict "root" $ "name" "canvas") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "collabhub-deps.dsn" (dict "root" $ "db" "canvas") | quote }}
  REDIS_CACHE_URL: redis://redis-cache:6379/0
  REDIS_REALTIME_URL: redis://redis-rt:6379/0
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-asset
  labels:
    {{- include "collabhub-deps.labels" (dict "root" $ "name" "asset") | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DSN: {{ include "collabhub-deps.dsn" (dict "root" $ "db" "asset") | quote }}
  REDIS_STREAMS_URL: redis://redis-streams:6379/0
  OBJECT_STORE_ENDPOINT: http://garage:3900
  OBJECT_STORE_ACCESS_KEY: {{ $accessKeyId | quote }}
  OBJECT_STORE_SECRET_KEY: {{ $secretAccessKey | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $app }}-worker
  labels:
    {{- include "collabhub-deps.labels" (dict "root" $ "name" "worker") | nindent 4 }}
type: Opaque
stringData:
  REDIS_STREAMS_URL: redis://redis-streams:6379/0
  # Read by KEDA's TriggerAuthentication, not the Worker. The key must exist even
  # though the local Redis has no password.
  REDIS_STREAMS_PASSWORD: ""
  ELASTICSEARCH_URL: http://elasticsearch:9200
  OBJECT_STORE_ENDPOINT: http://garage:3900
  OBJECT_STORE_ACCESS_KEY: {{ $accessKeyId | quote }}
  OBJECT_STORE_SECRET_KEY: {{ $secretAccessKey | quote }}
  SERVICE_TOKEN_URL: http://{{ $authName }}:8000/api/v1/auth/service-token
  WORKER_SERVICE_CLIENT_SECRET: {{ $workerSecret | quote }}
